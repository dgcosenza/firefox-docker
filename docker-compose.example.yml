# Example Docker Compose configuration for dgcosenza/firefox
# Pin by @sha256 digest in production and keep PASSWORD in a restricted .env file.

services:
  firefox:
    image: dgcosenza/firefox:latest
    container_name: firefox
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined
    shm_size: "1g"
    ports:
      - "192.0.2.10:3001:3001"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - TITLE=Firefox
      - CUSTOM_USER=browser
      - PASSWORD=${PASSWORD}
      - CHROME_CLI=https://start.duckduckgo.com/
      - MOZ_USE_XINPUT2=1
    volumes:
      - ./config:/config
      # Optional GPU acceleration:
      # - /dev/dri:/dev/dri
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -o /dev/null -w '%{http_code}' --max-time 5 https://127.0.0.1:3001/ | grep -qE '^(200|301|302|401)$$'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 2048M
        reservations:
          memory: 512M
