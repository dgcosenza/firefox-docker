user abc;
worker_processes 1;
pid /run/firefox-web/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 3000 default_server;
        listen [::]:3000 default_server;
        listen 3001 ssl default_server;
        listen [::]:3001 ssl default_server;
        http2 on;

        ssl_certificate /config/ssl/cert.pem;
        ssl_certificate_key /config/ssl/cert.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:FFSSL:4m;
        ssl_session_tickets off;

        include /run/firefox-web/auth.conf;

        root /run/firefox-web/www;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location /websockify {
            proxy_http_version 1.1;
            proxy_pass http://127.0.0.1:6080/;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
    }
}
